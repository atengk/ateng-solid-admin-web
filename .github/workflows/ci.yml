# ==============================================================================
# 工作流：ateng-solid-admin-web 前端持续集成流水线 (Node 22 + pnpm 11)
# 触发分支：main, dev
# ==============================================================================

name: Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-pr-title:
    name: 校验 PR 标题规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: 校验 PR 标题符合 Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  detect-changes:
    name: 探测变更路径
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 分析改动文件类型
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!**/*.md'
              - '!docs/**'
              - '!.gitignore'
              - '!.editorconfig'
              - '!LICENSE'

  foundation-lock-guard:
    name: 校验主干底座正式版锁定
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    timeout-minutes: 5
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 禁止 main 分支引入 yalc 与本地路径依赖
        run: |
          while IFS= read -r -d '' manifest; do
            if grep -Eq 'file:\.yalc/|file:\.\./|link:|yalc:|file:.*\.tgz' "$manifest"; then
              echo "::error file=$manifest::禁止在 main 分支残留 yalc / link / file:../ / .tgz 联调依赖！请先执行 yalc remove --all && pnpm up @atengk/* 锁回正式版。"
              exit 1
            fi
          done < <(find . -maxdepth 3 \( -name 'package.json' -o -name 'pnpm-lock.yaml' \) -not -path '*/node_modules/*' -print0)

  quality-gate:
    name: 四合一质量门禁 (Node 22 / pnpm 11)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code_changed != 'false'
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验脚本与 Hooks 语法
        run: |
          if ls scripts/*.sh >/dev/null 2>&1; then
            bash -n scripts/*.sh
          fi
          if [ -d .githooks ]; then
            HOOK_FILES=$(grep -l '^#!' .githooks/* 2>/dev/null || true)
            if [ -n "$HOOK_FILES" ]; then
              echo "$HOOK_FILES" | xargs -r bash -n
            fi
          fi

      - name: 安装 pnpm (按 packageManager 自动匹配)
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js 22 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 执行 typecheck / lint / test / build 四合一检查
        run: |
          if [ -f package.json ]; then
            pnpm install --frozen-lockfile
            if node -e "process.exit((require('./package.json').scripts||{}).typecheck?0:1)"; then pnpm run typecheck; fi
            if node -e "process.exit((require('./package.json').scripts||{}).lint?0:1)"; then pnpm run lint; fi
            if node -e "process.exit((require('./package.json').scripts||{}).test?0:1)"; then pnpm run test; fi
            if node -e "process.exit((require('./package.json').scripts||{}).build?0:1)"; then pnpm run build; fi
          else
            echo "当前尚处于文档与规范初始化阶段（无 package.json），跳过前端构建校验。"
          fi

  all-checks-passed:
    name: 质量门禁终审 (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-pr-title, foundation-lock-guard, quality-gate]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 汇总校验结果
        run: |
          for res in "${{ needs.validate-pr-title.result }}" "${{ needs.detect-changes.result }}" "${{ needs.foundation-lock-guard.result }}" "${{ needs.quality-gate.result }}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::Frontend CI 质量门禁检查失败！"
              exit 1
            fi
          done
          echo "✅ Frontend CI 全部门禁检查通过！"

      - name: 生成门禁看板报告
        if: always()
        run: |
          LOCK_RES="${{ needs.foundation-lock-guard.result }}"
          case "$LOCK_RES" in
            success) LOCK_DESC="✅ 通过" ;;
            skipped) LOCK_DESC="⚡ dev 放行" ;;
            *) LOCK_DESC="❌ 失败" ;;
          esac
          {
            echo "## 🚦 ateng-solid-admin-web CI 门禁报告"
            echo ""
            echo "| 检查项 | 状态 | 说明 |"
            echo "| :--- | :---: | :--- |"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "| **PR 标题规范** | ${{ needs.validate-pr-title.result == 'success' && '✅ 通过' || '❌ 失败' }} | Conventional Commits |"
            fi
            echo "| **变更路径探测** | ${{ needs.detect-changes.result == 'success' && '✅ 通过' || '❌ 异常' }} | 纯文档改动自动短路 |"
            echo "| **主干锁版门禁** | $LOCK_DESC | 仅在合入/推送 main 时强校验 |"
            if [ "${{ needs.detect-changes.outputs.code_changed }}" = "false" ]; then
              echo "| **四合一质量门禁** | ⚡ 短路直通 | 仅涉及文档改动 |"
            else
              echo "| **Node 22 + pnpm 11 门禁** | ${{ needs.quality-gate.result == 'success' && '✅ 通过' || '❌ 失败' }} | typecheck · lint · test · build |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
