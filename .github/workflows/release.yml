# ==============================================================================
# 工作流：ateng-solid-admin-web 自动化发版流水线 (GitHub Release)
# 说明：面向 Web 前端应用裁剪掉了 npm 中心仓发布步骤，保留 dist 产物归档、Changelog 与可选 GHCR 镜像
# ==============================================================================

name: Frontend Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (必须以 v 开头，符合 SemVer 规范，如 v1.0.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate-test:
    name: 发版前置质量门禁 (Node 22 / pnpm 11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm (按 packageManager 自动匹配)
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js 22 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 执行质量门禁与测试
        run: |
          if [ -f package.json ]; then
            pnpm install --frozen-lockfile
            if node -e "process.exit((require('./package.json').scripts||{}).typecheck?0:1)"; then pnpm run typecheck; fi
            if node -e "process.exit((require('./package.json').scripts||{}).lint?0:1)"; then pnpm run lint; fi
            if node -e "process.exit((require('./package.json').scripts||{}).test?0:1)"; then pnpm run test; fi
            if node -e "process.exit((require('./package.json').scripts||{}).build?0:1)"; then pnpm run build; fi
          else
            echo "package.json 尚未初始化，跳过测试与构建。"
          fi

  build-artifacts:
    name: 编译前端静态产物与校验和
    runs-on: ubuntu-latest
    needs: [gate-test]
    timeout-minutes: 15
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      raw_version: ${{ steps.meta.outputs.raw_version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      has_dockerfile: ${{ steps.probe.outputs.has_dockerfile }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 探测 Dockerfile 存在性
        id: probe
        run: |
          if [ -f Dockerfile ] || [ -f docker/Dockerfile ]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 解析与校验发版版本号
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT_REF="${{ github.ref_name }}"
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
            if [ "$CURRENT_REF" != "$DEFAULT_BRANCH" ]; then
              echo "::error::禁止在非默认主干分支 [$CURRENT_REF] 发版！"
              exit 1
            fi
            TAG_NAME="${{ inputs.version }}"
            if [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then TAG_NAME="v$TAG_NAME"; fi
            if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::版本号 [$TAG_NAME] 不符合 SemVer 规范！"
              exit 1
            fi
            if git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"; then
              echo "::error::远程仓库已存在标签 [$TAG_NAME]！"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          else
            TAG_NAME="${{ github.ref_name }}"
            if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::标签 [$TAG_NAME] 不符合 SemVer 规范！"
              exit 1
            fi
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
            git fetch origin "$DEFAULT_BRANCH"
            TAG_COMMIT=$(git rev-parse HEAD)
            if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/$DEFAULT_BRANCH"; then
              echo "::error::标签 [$TAG_NAME] 未合入主干分支 [$DEFAULT_BRANCH]！"
              exit 1
            fi
          fi

          RAW_VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "raw_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_NAME" =~ - ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 pnpm (按 packageManager 自动匹配)
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js 22 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步版本号、打包前端 dist 并生成 SHA-256
        run: |
          mkdir -p release-assets
          if [ -f package.json ]; then
            pnpm install --frozen-lockfile
            npm version "${{ steps.meta.outputs.raw_version }}" --no-git-tag-version --allow-same-version
            if node -e "process.exit((require('./package.json').scripts||{}).build?0:1)"; then
              pnpm run build
            fi
            if [ -d dist ]; then
              tar -czf "release-assets/ateng-solid-admin-web-${{ steps.meta.outputs.tag_name }}.tar.gz" -C dist .
            fi
          fi
          cd release-assets
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "checksums.txt" ]; then
              sha256sum "$file"
            fi
          done > checksums.txt || true

      - name: 归档制品附件
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: release-assets/*
          if-no-files-found: ignore
          retention-days: 1

  publish-release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出源码 (全量历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载构建制品
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: release-assets
        continue-on-error: true

      - name: 生成发布日志 (git-cliff)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: ${{ hashFiles('.cliff.toml') != '' && '.cliff.toml' || '' }}
          args: --tag ${{ needs.build-artifacts.outputs.tag_name }} --latest --strip header --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGELOG_RELEASE.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-artifacts.outputs.tag_name }}
          name: ${{ needs.build-artifacts.outputs.tag_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: ${{ needs.build-artifacts.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: 构建并推送静态 Web 容器镜像 (GHCR)
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: needs.build-artifacts.outputs.has_dockerfile == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: 转换仓库名为小写
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 QEMU 与 Docker Buildx
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPO_LC }}
          flavor: |
            latest=${{ needs.build-artifacts.outputs.is_prerelease != 'true' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build-artifacts.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build-artifacts.outputs.tag_name }}
            type=sha,format=short

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
