<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ateng-solid 企业级多租户通用管理后台：支持可开关 SaaS 多租户、RBAC 权限治理、组织架构、动态字典与审计追踪。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ateng-solid 管理后台</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('solid-theme-mode');
          var isDark =
            mode === 'dark' ||
            (mode === 'auto' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (_err) {
          // 忽略无痕模式等存储访问受限场景
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
